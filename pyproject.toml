[project]
name = "pariksha"
version = "0.1.0"
description = "An adversarial certification harness for money-moving AI agents on Razorpay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "anthropic>=0.40",
    "mcp>=1.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.15",
    "rich>=13.9",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
agentsdk = ["claude-agent-sdk>=0.1.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
pariksha = "pariksha.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pariksha"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented idiom is to call Argument/Option in parameter defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
