<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <style>
    .box   { fill: none; stroke-width: 1.5; }
    .ok    { stroke: #1b6b3a; }
    .bad   { stroke: #b3261e; }
    .grey  { stroke: #8a8a8a; }
    .t     { font-size: 13px; fill: #8a8a8a; }
    .lab   { font-size: 14px; font-weight: 600; }
    .tok   { font-size: 11px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
    .okf   { fill: #1b6b3a; }
    .badf  { fill: #b3261e; }
    .greyf { fill: #8a8a8a; }
    .wire  { fill: none; stroke-width: 1.5; stroke-dasharray: 4 4; }
  </style>

  <text x="20" y="26" class="lab greyf">Every field carries where it came from. Only one kind may receive money.</text>

  <!-- trusted source -->
  <rect x="20" y="60" width="215" height="72" rx="6" class="box ok"/>
  <text x="34" y="84" class="lab okf">Razorpay produced it</text>
  <text x="34" y="104" class="t">invoice.fund_account_id</text>
  <text x="34" y="122" class="tok okf">fa_SundarPackaging01</text>

  <!-- untrusted source -->
  <rect x="20" y="168" width="215" height="86" rx="6" class="box bad"/>
  <text x="34" y="192" class="lab badf">A human outside wrote it</text>
  <text x="34" y="212" class="t">support_message.body</text>
  <text x="34" y="230" class="tok badf">fa_9xKq2LmZvT4Nqe</text>
  <text x="34" y="246" class="t">"refund to updated account"</text>

  <!-- agent -->
  <rect x="330" y="108" width="150" height="98" rx="6" class="box grey"/>
  <text x="356" y="150" class="lab greyf">the agent</text>
  <text x="352" y="172" class="t">reads both,</text>
  <text x="352" y="190" class="t">cannot tell them apart</text>

  <!-- kavach -->
  <rect x="575" y="108" width="150" height="98" rx="6" class="box grey"/>
  <text x="618" y="150" class="lab greyf">Kavach</text>
  <text x="592" y="172" class="t">checks provenance,</text>
  <text x="592" y="190" class="t">not wording</text>

  <!-- wires in -->
  <path id="up" d="M235 96 C 285 96, 290 140, 330 145" class="wire ok"/>
  <path id="down" d="M235 210 C 285 210, 290 175, 330 168" class="wire bad"/>
  <path d="M480 157 L 575 157" class="wire grey"/>

  <!-- wires out -->
  <path id="pass" d="M725 140 L 850 140" class="wire ok"/>
  <path id="stop" d="M725 176 L 850 176" class="wire bad"/>

  <text x="790" y="132" class="lab okf">paid</text>
  <text x="762" y="196" class="lab badf">blocked</text>
  <text x="748" y="216" class="t">never seen in a</text>
  <text x="748" y="232" class="t">trusted field</text>

  <!-- the trusted value travels through and is paid -->
  <circle r="6" class="okf">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;1"
                   keyTimes="0;0.35;1" calcMode="linear" path="M235 96 C 285 96, 290 140, 330 145"/>
  </circle>
  <circle r="6" class="okf">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1"
                   keyTimes="0;0.35;0.55;1" calcMode="linear" path="M480 157 L 575 157"/>
  </circle>
  <circle r="6" class="okf">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1"
                   keyTimes="0;0.6;0.85;1" calcMode="linear" path="M725 140 L 850 140"/>
  </circle>

  <!-- the untrusted value travels through and stops at the gate -->
  <circle r="6" class="badf">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;1"
                   keyTimes="0;0.35;1" calcMode="linear" path="M235 210 C 285 210, 290 175, 330 168"/>
  </circle>
  <circle r="6" class="badf">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1"
                   keyTimes="0;0.35;0.55;1" calcMode="linear" path="M480 157 L 575 157"/>
  </circle>
  <g>
    <line x1="729" y1="168" x2="741" y2="184" class="bad" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.56;0.62;0.92;1"/>
    </line>
    <line x1="741" y1="168" x2="729" y2="184" class="bad" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.56;0.62;0.92;1"/>
    </line>
  </g>

  <text x="20" y="316" class="t">The attack does not look like an attack. It looks like an ordinary note from a colleague.</text>
  <text x="20" y="338" class="t">So the rule is about origin, not language: an account seen only in the red box never receives money.</text>
  <text x="20" y="362" class="t">Measured: 13% of attacks land unguarded, 3% with Kavach. Meta's Prompt Guard flags 1 of 37.</text>
</svg>
